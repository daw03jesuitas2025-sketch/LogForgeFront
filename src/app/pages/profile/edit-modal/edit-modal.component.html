<div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden text-slate-700">

    <!-- Cabecera del Modal -->
    <div class="px-6 py-4 border-b flex justify-between items-center bg-slate-50/50">
      <h3 class="font-bold text-slate-800">{{ title }}</h3>
      <button (click)="close.emit()" class="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
    </div>

    <div class="p-6">

      <!-- FORMULARIOS REACTIVOS (Para Basic, Experience y Education) -->
      <form *ngIf="type !== 'skills'" [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">

        <!-- 1. Campos para Información Básica -->
        <div *ngIf="type === 'basic'" class="space-y-4">
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Nombre Completo</label>
            <input formControlName="name" type="text"
              class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Titular Profesional</label>
            <input formControlName="title" type="text" placeholder="Ej: Fullstack Developer"
              class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Ubicación</label>
            <input formControlName="location" type="text" placeholder="Ej: Madrid, España"
              class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Biografía</label>
            <textarea formControlName="biography" rows="4"
              class="w-full border rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500 resize-none"
              placeholder="Cuéntanos un poco sobre ti..."></textarea>
          </div>
        </div>

        <!-- 2. Campos para Experiencia o Educación -->
        <div *ngIf="type === 'experience' || type === 'education'" class="space-y-4">
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">
              {{ type === 'experience' ? 'Empresa' : 'Institución' }}
            </label>
            <input *ngIf="type === 'experience'" formControlName="company" type="text"
              class="w-full border rounded-lg px-3 py-2 text-sm focus:border-blue-500 outline-none">
            <input *ngIf="type === 'education'" formControlName="institution" type="text"
              class="w-full border rounded-lg px-3 py-2 text-sm focus:border-blue-500 outline-none">
          </div>

          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">
              {{ type === 'experience' ? 'Puesto / Cargo' : 'Título / Carrera' }}
            </label>
            <input *ngIf="type === 'experience'" formControlName="position" type="text"
              class="w-full border rounded-lg px-3 py-2 text-sm focus:border-blue-500 outline-none">
            <input *ngIf="type === 'education'" formControlName="degree" type="text"
              class="w-full border rounded-lg px-3 py-2 text-sm focus:border-blue-500 outline-none">
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Fecha Inicio</label>
              <input formControlName="start_date" type="date"
                class="w-full border rounded-lg px-3 py-2 text-sm outline-none">
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Fecha Fin</label>
              <input formControlName="end_date" type="date"
                class="w-full border rounded-lg px-3 py-2 text-sm outline-none">
            </div>
          </div>
        </div>

        <!-- Dentro de tu <form [formGroup]="form"> en el Modal -->
<div *ngIf="type === 'project'" class="space-y-4">
  <div>
    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Título del Proyecto</label>
    <input formControlName="title" type="text" placeholder="Ej: App de Gestión de Inventarios" 
           class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-blue-500 outline-none">
  </div>

  <div>
    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Descripción</label>
    <textarea formControlName="description" rows="4" placeholder="Cuéntanos sobre las tecnologías y el propósito del proyecto..." 
              class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-blue-500 outline-none resize-none"></textarea>
  </div>

  <div>
    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">
      <i class="fab fa-github mr-1"></i> URL del Repositorio (GitHub / GitLab)
    </label>
    <input formControlName="repo_url" type="url" placeholder="https://github.com/tu-usuario/proyecto" 
           class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-blue-500 outline-none">
  </div>
</div>

        <!-- Botones de Acción (Reactivos) -->
        <div class="flex gap-3 pt-4 border-t mt-6">
          <button type="button" (click)="close.emit()"
            class="flex-1 px-4 py-2.5 border border-slate-200 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50 transition-colors">Cancelar</button>
          <button type="submit" [disabled]="form.invalid"
            class="flex-1 px-4 py-2.5 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
            Guardar Cambios
          </button>
        </div>
      </form>

      <!-- 3. Campo para Skills (Independiente del FormGroup) -->
      <div *ngIf="type === 'skills'" class="space-y-4">
        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Gestionar Skills (separadas por
          comas)</label>
        <textarea #skillsInput placeholder="Angular, Laravel, SQL, TailwindCSS..."
          class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm h-32 outline-none resize-none focus:border-blue-500"></textarea>

        <!-- Botones de Acción (Skills) -->
        <div class="flex gap-3 pt-4 border-t mt-6">
          <button (click)="close.emit()"
            class="flex-1 px-4 py-2.5 border border-slate-200 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50 transition-colors">Cancelar</button>
          <button (click)="onSaveSkills(skillsInput.value)"
            class="flex-1 px-4 py-2.5 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700 transition-colors">Sincronizar</button>
        </div>
      </div>

    </div>
  </div>
</div>
