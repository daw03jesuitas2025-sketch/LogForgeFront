<div class="bg-white rounded-xl border shadow-sm">
  <div class="flex justify-between items-center p-5 border-b bg-purple-50/30">
    <h3 class="font-semibold text-gray-700">Formación Académica</h3>
    <button (click)="openAdd()" class="w-8 h-8 rounded-full bg-green-100 text-green-700 flex items-center justify-center hover:bg-green-200 transition-colors">
      +
    </button>
  </div>

  <div class="p-6 space-y-6">
    <div *ngFor="let edu of educations" class="flex justify-between items-start group">
      <div class="flex gap-4">
        <div class="w-10 h-10 bg-gray-100 rounded-lg flex items-center justify-center text-xl shadow-sm border border-gray-50">🎓</div>
        <div>
          <h4 class="font-semibold text-gray-800">{{ edu.degree }}</h4>
          <p class="text-sm text-gray-500">{{ edu.institution }}</p>
          <p class="text-xs text-gray-400">
            {{ edu.start_date | date:'yyyy' }} - {{ edu.end_date ? (edu.end_date | date:'yyyy') : 'Actualidad' }}
          </p>
        </div>
      </div>
      <button (click)="openEdit(edu)" class="text-[11px] font-bold text-blue-500 opacity-0 group-hover:opacity-100 transition-all uppercase">
        Editar
      </button>
    </div>
    
    <div *ngIf="educations.length === 0" class="text-center py-4 text-gray-400 text-sm italic">
      No hay formación académica registrada.
    </div>
  </div>
</div>

<div *ngIf="isModalOpen" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden">
    
    <div class="px-6 py-4 border-b flex justify-between items-center bg-slate-50/50">
      <h3 class="font-bold text-slate-800">{{ modalTitle }}</h3>
      <button (click)="isModalOpen = false" class="text-slate-400 hover:text-slate-600 text-2xl">&times;</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="save()" class="p-6 space-y-4">
      <div>
        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Institución</label>
        <input formControlName="institution" type="text" placeholder="Ej: Universidad Autónoma" 
               class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Título / Grado</label>
        <input formControlName="degree" type="text" placeholder="Ej: Grado en Informática" 
               class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-blue-500 outline-none">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Fecha Inicio</label>
          <input formControlName="start_date" type="date" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none">
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Fecha Fin</label>
          <input formControlName="end_date" type="date" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none">
        </div>
      </div>

      <div class="flex gap-3 pt-4">
        <button type="button" (click)="isModalOpen = false" class="flex-1 px-4 py-2.5 border rounded-lg text-sm font-semibold text-slate-600">
          Cancelar
        </button>
        <button type="submit" [disabled]="form.invalid" class="flex-1 px-4 py-2.5 bg-blue-400 text-white rounded-lg text-sm font-semibold hover:bg-blue-500 shadow-md">
          Guardar Cambios
        </button>
      </div>
    </form>
  </div>
</div>
