<div class="bg-white rounded-xl shadow-sm border p-6">
  <div class="flex justify-between items-center mb-6">
    <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
      <i class="fas fa-folder-open text-green-600"></i> Proyectos
    </h3>
    <button (click)="add.emit()" class="text-green-600 hover:bg-green-50 p-2 rounded-full transition-colors">
      <i class="fas fa-plus-circle fa-lg"></i>
    </button>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div *ngFor="let project of projects" class="group relative border rounded-xl p-4 hover:border-green-500 transition-all">
      <div class="flex justify-between items-start">
        <h4 class="font-bold text-gray-800">{{ project.title }}</h4>
        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
          <button (click)="edit.emit(project)" class="text-blue-500"><i class="fas fa-edit"></i></button>
          <button (click)="delete.emit(project)" class="text-red-500"><i class="fas fa-trash"></i></button>
        </div>
      </div>
      <p class="text-sm text-gray-600 mt-2 line-clamp-2">{{ project.description }}</p>
      <a *ngIf="project.repo_url" [href]="project.repo_url" target="_blank" class="text-xs text-green-600 mt-3 inline-flex items-center gap-1 hover:underline">
        <i class="fab fa-github"></i> Ver repositorio
      </a>
    </div>
  </div>

  <div *ngIf="projects.length === 0" class="text-center py-8 border-2 border-dashed rounded-xl">
    <p class="text-gray-400">No hay proyectos añadidos todavía.</p>
  </div>
</div>
