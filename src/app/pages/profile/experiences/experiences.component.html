<div class="bg-white rounded-xl border shadow-sm">
  <div class="flex justify-between items-center p-5 border-b">
    <h3 class="font-semibold text-gray-700">Experiencia</h3>
    <button
      (click)="add.emit()"
      class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-600 transition-colors"
    >
      +
    </button>
  </div>

  <div class="p-6 space-y-6">
    
    <div *ngFor="let job of jobs" class="flex justify-between items-start group">
      <div class="flex gap-4">
        <div class="w-10 h-10 bg-gray-50 rounded-lg flex items-center justify-center border border-gray-100 shadow-sm text-xl">
          💼
        </div>

        <div>
          <h4 class="font-semibold text-gray-800 leading-tight">
            {{ job.position }}
          </h4>

          <p class="text-sm text-gray-500 mt-0.5">
            {{ job.company }}
          </p>

          <p class="text-[11px] text-gray-400 mt-1 uppercase tracking-wider">
            {{ job.start_date | date:'MMM yyyy' }} — {{ job.end_date ? (job.end_date | date:'MMM yyyy') : 'Actualidad' }}
          </p>

          <p class="text-sm text-gray-600 mt-3 max-w-xl leading-relaxed">
            {{ job.description }}
          </p>
        </div>
      </div>

      <button 
        (click)="edit.emit(job)"
        class="text-[11px] font-bold text-blue-500 hover:text-blue-700 opacity-0 group-hover:opacity-100 transition-all uppercase tracking-tight"
      >
        Editar
      </button>
    </div>

    <div *ngIf="jobs.length === 0" class="py-8 text-center border-2 border-dashed border-gray-50 rounded-xl">
      <p class="text-sm text-gray-400 italic">Aún no has añadido experiencias laborales.</p>
    </div>

  </div>
</div>
