<div class="p-6">
  <h2 class="text-2xl font-bold mb-6 text-gray-800">Mis Ofertas de Trabajo</h2>

  <div class="grid gap-4">
    <div *ngFor="let offer of offers" class="bg-white p-4 rounded-lg shadow border flex justify-between items-center">
      <div>
        <h3 class="font-bold text-lg text-blue-700">{{ offer.title }}</h3>
        <p class="text-gray-500 text-sm">{{ offer.location }} | {{ offer.type }}</p>
      </div>
      <button (click)="verCandidatos(offer.id, offer.title)" 
        class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
        Ver Candidatos ({{ offer.applications_count || 0 }})
      </button>
    </div>
  </div>

  <div *ngIf="showModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl w-full max-w-2xl max-h-[80vh] overflow-hidden flex flex-col">
      <div class="p-4 border-b flex justify-between items-center bg-gray-50">
        <h3 class="font-bold text-lg">Candidatos para: {{ selectedOfferTitle }}</h3>
        <button (click)="cerrarModal()" class="text-gray-500 hover:text-red-500 text-2xl">&times;</button>
      </div>
      
      <div class="p-4 overflow-y-auto flex-1">
        <div *ngIf="selectedApplications.length === 0" class="text-center py-10 text-gray-400">
          No hay postulaciones para esta oferta aún.
        </div>
        
        <div *ngFor="let app of selectedApplications" class="flex items-center justify-between p-3 border-b hover:bg-gray-50">
          <div>
            <p class="font-semibold text-gray-800">{{ app.user.name }}</p>
            <p class="text-sm text-gray-500">{{ app.user.email }}</p>
          </div>
          <span class="text-xs px-2 py-1 rounded bg-green-100 text-green-700 font-bold uppercase">
            {{ app.status }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
