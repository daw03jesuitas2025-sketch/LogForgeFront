<header class="bg-[#f9fbfd]/90 backdrop-blur-md border-b border-[#e3e9ef] sticky top-0 z-50"> 
  <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">

    <!-- Logo -->
    <div class="flex items-center gap-2 sm:gap-3 shrink-0">
      <div class="w-8 h-8 sm:w-9 sm:h-9 bg-[#dbeafe] rounded-lg flex items-center justify-center">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="1" width="6" height="6" rx="1.5" fill="#3b82f6"/>
          <rect x="9" y="1" width="6" height="6" rx="1.5" fill="#93c5fd"/>
          <rect x="1" y="9" width="6" height="6" rx="1.5" fill="#93c5fd"/>
          <rect x="9" y="9" width="6" height="6" rx="1.5" fill="#3b82f6"/>
        </svg>
      </div>
      <p class="text-sm sm:text-base font-bold text-[#1e3a8a] tracking-tight">LogForge</p>
    </div>

    <!-- Navegación Compartida -->
    <div class="flex items-center justify-end">
      <app-shared-nav></app-shared-nav>
    </div>
    
  </div>
</header>
<!-- Aquí se cargan las páginas -->
<router-outlet></router-outlet>

<!-- Footer -->
<footer class="border-t border-[#e3e9ef] bg-[#f9fbfd]">
    
    <div class="mx-auto flex max-w-7xl flex-col md:flex-row items-center justify-between gap-8 px-6 py-10">
        
        <!-- Logo: Centrado en móvil, izquierda en PC -->
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-[#dbeafe] rounded-lg flex items-center justify-center">
                <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
                    <rect x="1" y="1" width="6" height="6" rx="1.5" fill="#3b82f6"/>
                    <rect x="9" y="1" width="6" height="6" rx="1.5" fill="#93c5fd"/>
                    <rect x="1" y="9" width="6" height="6" rx="1.5" fill="#93c5fd"/>
                    <rect x="9" y="9" width="6" height="6" rx="1.5" fill="#3b82f6"/>
                </svg>
            </div>
            <p class="text-sm font-semibold text-[#1e3a8a]">LogForge</p>
        </div>

        <!-- Links: En móvil se ven como una grilla de 2 columnas o fila flexible -->
        <div class="flex flex-wrap justify-center gap-x-6 gap-y-3 text-xs sm:text-sm text-gray-500 font-medium">
            <a href="#" class="hover:text-[#3b82f6] transition-colors">Privacidad</a>

            <p class="text-center md:text-left">© 2026 LogForge. Todos los derechos reservados.</p>
