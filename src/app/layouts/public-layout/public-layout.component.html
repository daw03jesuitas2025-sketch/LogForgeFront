<header class="sticky top-0 z-50 w-full border-b border-slate-100 bg-white/80 backdrop-blur-md">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4 sm:px-6">
    
    <!-- Brand: Logo más pequeño en móvil -->
    <a routerLink="/" class="flex items-center gap-1.5 shrink-0">
      <div class="grid h-6 w-6 place-items-center">
        <svg width="18" height="18" viewBox="0 0 22 22" fill="none">
          <circle cx="7" cy="7" r="2" fill="#19E5B3"/><circle cx="15" cy="7" r="2" fill="#19E5B3"/>
          <circle cx="11" cy="11" r="2" fill="#19E5B3"/><circle cx="7" cy="15" r="2" fill="#19E5B3"/>
          <circle cx="15" cy="15" r="2" fill="#19E5B3"/>
        </svg>
      </div>
      <span class="text-xs font-bold tracking-tight text-slate-900 sm:text-sm">LogForge</span>
    </a>

    <!-- Nav: Visible siempre, pero ajusta el espaciado -->
    <nav class="flex items-center gap-3 sm:gap-8">
      <a class="text-[10px] font-medium text-slate-500 hover:text-slate-900 sm:text-xs" href="#">Nosotros</a>
      <a class="text-[10px] font-medium text-slate-500 hover:text-slate-900 sm:text-xs" href="#">Contacto</a>
      
      <!-- Botón de ayuda más pequeño en móvil -->
      <a class="rounded-full border border-slate-200 bg-white px-3 py-1.5 text-[10px] font-bold text-slate-700 shadow-sm transition-all hover:bg-slate-50 sm:px-5 sm:py-2 sm:text-xs" href="#">
        Ayuda
      </a>
    </nav>

  </div>
</header>

<!-- Aquí se cargan las páginas -->
<router-outlet></router-outlet>

      <!-- Logo -->

        <div class="grid h-7 w-7 place-items-center">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">

        <span class="text-sm font-bold text-slate-900">LogForge</span>
